copyright_year: 2026
name: Awesome Uptime Monitoring
initial_prompt: |-
  A curated directory of uptime, cron/heartbeat, synthetic and website monitoring services and tools. Include products such as UptimeRobot, Better Stack, Uptime Kuma, Checkly, Cronitor, Healthchecks.io, Pingdom, StatusCake, Hyperping, OneUptime, Gatus, OpenStatus, plus other notable commercial and open-source options. Categories: Uptime & Website Monitoring, Cron & Heartbeat Monitoring, Synthetic & API Monitoring, Status Pages, Open-Source & Self-Hosted, SSL & Domain Monitoring. For every item capture the official website, a short factual description, pricing model (free, freemium, paid, open source), deployment (cloud or self-hosted), key features and integrations.

  Initial categories: Uptime & Website Monitoring; Cron & Heartbeat Monitoring; Synthetic & API Monitoring; Status Pages; Open-Source & Self-Hosted; SSL & Domain Monitoring.
  Target keywords: uptime monitoring, website monitoring, cron monitoring, status page.

  Start with these source lists (use the raw README link for GitHub lists):
  - https://www.saashub.com/best-uptime-monitoring-software
  - https://www.saashub.com/best-website-monitoring-software
  - https://awesome-selfhosted.net/tags/monitoring--status-pages.html
  - https://github.com/ripienaar/free-for-dev#monitoring
  - https://openalternative.co/categories/infrastructure-operations/monitoring-observability
  - https://raw.githubusercontent.com/ivbeg/awesome-status-pages/HEAD/README.md
  - https://raw.githubusercontent.com/AlertSleep/awesome-uptime-monitoring/HEAD/README.md
  - https://en.wikipedia.org/wiki/Comparison_of_network_monitoring_systems
  - https://github.com/topics/uptime-monitor

  Inclusion rules: every item is a real product, service, open-source project or platform in scope; never a statistic, quote, blog post, person or general concept.
  One item per product. The item URL is the official website (never an affiliate link, review-site page or "top 10" article). Skip discontinued products and sites that no longer resolve.
  Descriptions: 2-4 factual sentences, no hype; state the pricing model; for open source state the license and link the repository.
  Each item gets exactly one primary category from the initial categories; do not create near-duplicate categories.
  Tags where they apply: Open Source, Self-Hosted, Free Plan, Freemium, Paid, Enterprise, API, AI-Powered, plus niche-specific ones.
  Never use G2, Capterra, GetApp, TrustRadius, AlternativeTo, Product Hunt, SourceForge/Slashdot, There's An AI For That or Toolify as sources.
