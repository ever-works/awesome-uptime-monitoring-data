markdown: >-
  ## Overview


  SigNoz is an open-source observability platform designed for cloud-native
  applications. It unifies metrics, traces, and logs into a single platform for
  monitoring and troubleshooting microservices architectures.


  ## Features


  - OpenTelemetry-native observability platform

  - Metrics, traces, and logs in a single pane

  - Distributed tracing with automatic instrumentation

  - Log management and querying

  - Real-time metrics visualization

  - Dashboards and alerts

  - Self-hosted deployment


  ## License


  MIT License


