name: op5 Monitor
description: op5 Monitor is a network and infrastructure monitoring platform
  written in C and PHP. It offers auto-discovery, SNMP, syslog, plugins,
  trending, trend prediction, triggers, a web app, distributed monitoring, and
  inventory under a limited free / commercial license model.
