markdown: >-
  ## Overview


  Amazon CloudWatch is a monitoring and observability service built for DevOps
  engineers, developers, site reliability engineers (SREs), and IT managers. It
  provides data and actionable insights to monitor applications, understand and
  respond to system-wide performance changes, and optimize resource utilization.


  ## Free Tier


  - 10 custom metrics and alarms

  - 1 million API requests per month

  - 5 GB of log data ingestion per month

  - 5 GB of log data archive per month


  ## Source


  Listed under Amazon Web Services in the free-for-dev repository:
  https://github.com/ripienaar/free-for-dev#monitoring
