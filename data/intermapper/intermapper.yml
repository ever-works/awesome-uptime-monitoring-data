name: InterMapper
description: InterMapper is a network monitoring and mapping software by
  HelpSystems that runs on Windows, Linux, and macOS. It uses PostgreSQL for
  data storage, offers auto-discovery, SNMP, syslog, plugins, triggers, a
  viewing web app, distributed monitoring, and inventory under a limited free /
  commercial license model.
source_url: https://intermapper.com
