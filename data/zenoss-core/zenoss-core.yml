markdown: >-
  ## Overview


  Zenoss Core is an open-source IT monitoring platform that provides
  infrastructure monitoring, event management, and performance analysis. It is
  written in Python and Java.


  ## Features


  - Auto-discovery of hosts and network devices

  - Agentless monitoring

  - SNMP, Syslog, and plugin support

  - Trending and trend prediction

  - Threshold triggers and alerts

  - Full-control web application

  - Distributed monitoring and inventory

  - Access control and IPv6 support

  - Network maps

  - ZODB, MariaDB, Apache HBase data storage


  ## Pricing


  Free Core edition (GPL); commercial Enterprise edition available.


  ## License


  Free Core GPL, Commercial Enterprise.
