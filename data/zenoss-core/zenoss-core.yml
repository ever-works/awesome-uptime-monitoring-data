name: Zenoss Core
description: Zenoss Core is an open-source IT infrastructure monitoring platform
  written in Python and Java. It uses ZODB, MariaDB, and Apache HBase for data
  storage, offers auto-discovery, SNMP, syslog, plugins, trending, trend
  prediction, triggers, a full-control web app, distributed monitoring, and
  inventory under a free Core GPL / commercial Enterprise license model.
