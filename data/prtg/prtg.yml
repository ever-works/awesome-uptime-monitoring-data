name: PRTG
description: PRTG is a commercial network monitoring solution by Paessler
  written in Delphi. It uses flat file data storage, offers auto-discovery,
  SNMP, syslog, plugins, trending, triggers, a full-control web app, distributed
  monitoring, and inventory under a limited free / commercial license model.
