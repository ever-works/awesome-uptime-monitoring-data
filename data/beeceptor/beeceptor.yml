markdown: >-
  ## Overview


  Beeceptor is a no-code, cloud-based platform for mocking and debugging
  multi-protocol APIs.


  ## Features


  - Instant mock servers for REST, SOAP, gRPC & GraphQL

  - Rules-based logic and CRUD & stateful mocking

  - Proxying and CORS management

  - Public dashboard/endpoint for viewing submitted requests and responses


  ## Pricing


  Free plan includes 50 requests per day and a public dashboard/endpoint where
  anyone with the dashboard URL can view submitted requests and responses.
