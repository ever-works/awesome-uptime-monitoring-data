markdown: >-
  ## Overview


  AIWatch is an open-source dashboard for monitoring third-party AI services.


  ## Features


  - Monitoring for 31 AI services including Claude, OpenAI, Gemini, Mistral, and
  Groq

  - Reliability scoring

  - Incident analysis

  - Discord and Slack alerts

  - Built on Cloudflare Workers + KV

  - Live demo available at ai-watch.dev


  ## Pricing


  Free and open-source under the AGPL-3.0 license.


  ## Repository


  https://github.com/bentleypark/aiwatch
