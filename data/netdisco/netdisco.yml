name: Netdisco
description: Netdisco is an open-source network management and discovery tool
  written in Perl. It uses PostgreSQL for data storage, offers auto-discovery,
  SNMP, syslog, plugins, triggers, a web app, distributed monitoring, and
  inventory, and is released under the BSD license.
