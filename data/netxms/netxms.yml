name: NetXMS
description: NetXMS is an open-source network and infrastructure monitoring
  platform written in C and Java. It supports multiple database backends
  including PostgreSQL, MariaDB, MySQL, MS SQL, Oracle, and SQLite, and offers
  auto-discovery, SNMP, syslog, plugins, triggers, a web app, distributed
  monitoring, and inventory under the GNU GPL license.
