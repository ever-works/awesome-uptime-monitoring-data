markdown: >-
  ## Overview


  ciao is an open-source tool that checks HTTP(S) URL endpoints for HTTP status
  codes or TCP stack errors.


  ## Features


  - HTTP(S) URL endpoint monitoring

  - TCP stack error detection

  - E-Mail and Webhook notifications on status change


  ## Pricing


  Free and open-source.


  ## Repository


  https://github.com/brotandgames/ciao
