name: StatusPile
description: StatusPile is a status page aggregation service that lets you track
  the status pages of your upstream providers in one place. It monitors multiple
  external status pages and aggregates their incidents and uptime into a single
  dashboard, helping teams stay informed about third-party service outages. The
  service is offered with a free plan.
