markdown: >-
  ## Overview


  StatusPile is described as "a status page of status pages." It enables users
  to track the status pages of their upstream providers, aggregating incidents
  and uptime across multiple third-party services into one consolidated view.


  ## Pricing


  Free plan available as listed on free-for-dev.


  ## Source


  Listed on the free-for-dev repository
  (https://github.com/ripienaar/free-for-dev) under the Monitoring section.
