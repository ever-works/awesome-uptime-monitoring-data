name: SolarWinds
description: SolarWinds is a commercial IT management and network monitoring
  platform written in .NET. It uses SQL for data storage, offers auto-discovery,
  SNMP, syslog, plugins, trending, trend prediction, triggers, a full-control
  web app, distributed monitoring, and inventory under a commercial license.
