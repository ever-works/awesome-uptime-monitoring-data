markdown: >-
  ## Overview


  CertPost provides live SSL/TLS certificate monitoring on port 443 or custom
  ports (SMTP/IMAP). It reads the served certificate on the wire, performs full
  chain verification, and sends alerts via email or webhook before expiration.


  ## Features


  - Live SSL/TLS certificate monitoring on port 443 or custom ports

  - Reads served certificate on the wire

  - Full chain verification

  - Alerts via email or webhook before expiration


  ## Pricing


  Free tier: 3 certificates monitored forever.
