name: PA Server Monitor
description: PA Server Monitor is a Windows-based server monitoring tool written
  in C++ and .NET. It uses SQLite and Microsoft SQL Server for data storage,
  offers auto-discovery, SNMP, syslog, plugins, trending, trend prediction,
  triggers, a web app for viewing/acknowledging/reporting, distributed
  monitoring, and inventory under a limited free / commercial license.
source_url: https://www.poweradmin.com
