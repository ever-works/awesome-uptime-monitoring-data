name: OpenNMS
description: OpenNMS is an open-source enterprise network monitoring and
  management platform written in Java. It supports JRobin/RRDTool, Apache
  Cassandra, and PostgreSQL backends, offers auto-discovery, SNMP, syslog,
  plugins, trending, trend prediction, triggers, a full-control web app,
  distributed monitoring, and inventory under the AGPLv3 license.
