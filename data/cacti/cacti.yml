name: Cacti
description: Cacti is an open-source network monitoring and graphing tool built
  on PHP and RRDtool. It collects performance data via SNMP and provides
  graphing, trending, threshold alerts, and web-based management under the GNU
  GPL license.
source_url: https://cacti.net
category: Open-Source & Self-Hosted
