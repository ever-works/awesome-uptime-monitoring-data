name: Xymon/Hobbit
description: Xymon (formerly Hobbit) is an open-source system and network
  monitoring tool written in C and Shell. It uses flat file, RRDTool, and MySQL
  (via plugin) data storage, supports auto-discovery via plugin, SNMP via
  plugin, plugins, triggers, a web app for viewing/acknowledging/reporting,
  distributed monitoring, and inventory under the GNU GPL license.
