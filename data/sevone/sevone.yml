name: SevOne
description: SevOne is a commercial network performance monitoring platform
  written in C, C++, and PHP. It uses MySQL for data storage, offers
  auto-discovery, SNMP, syslog, plugins, trending, trend prediction, triggers, a
  full-control web app, distributed monitoring, and inventory under a commercial
  license.
