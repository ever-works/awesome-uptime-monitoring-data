markdown: >-
  ## Overview


  SevOne is a network performance management platform that collects, analyzes,
  and visualizes network performance data at scale. It is now part of IBM and
  written in C, C++, and PHP.


  ## Features


  - Auto-discovery of hosts and network devices

  - Agentless monitoring

  - SNMP, Syslog, and plugin support

  - Trending and trend prediction

  - Threshold triggers and alerts

  - Full-control web application

  - Distributed monitoring and inventory

  - Access control and IPv6 support

  - Network maps

  - MySQL data storage


  ## Pricing


  Commercial (enterprise) licensing.


  ## Platform


  C, C++, PHP
