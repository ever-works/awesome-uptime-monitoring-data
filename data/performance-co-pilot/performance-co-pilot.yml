name: Performance Co-Pilot
description: Performance Co-Pilot (PCP) is an open-source system performance
  monitoring framework written in C, Perl, Python, and POSIX. It uses flat file
  data storage, supports plugins, triggers, a web viewing frontend, distributed
  monitoring, and inventory, and is released under GPL and LGPL licenses.
