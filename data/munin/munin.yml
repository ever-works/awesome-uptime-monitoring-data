name: Munin
description: Munin is an open-source networked resource monitoring tool written
  in Perl. It uses RRDtool for data storage, supports logical grouping,
  trending, trend prediction, plugins, and a web viewing frontend, and is
  released under the GNU GPL license.
source_url: https://munin-monitoring.org
category: Open-Source & Self-Hosted
tags:
  - open-source
  - Perl
  - RRDtool
markdown: >-
  ## Overview


  Munin is an open-source monitoring and alerting tool that monitors servers and
  services and presents data through graphs. It uses a node-based architecture
  where agents run on monitored hosts.


  ## Features


  - Logical grouping of hosts

  - Trending and trend prediction

  - Plugin-based architecture

  - Partial triggers and alerts

  - Web-based viewing frontend

  - Monitoring via nodes (distributed)

  - RRDtool data storage

  - IPv6 support


  ## License


  Released under the GNU General Public License (GPL).


  ## Repository


  https://github.com/munin-monitoring/munin
