description: Pandora FMS is an open-source and commercial flexible monitoring
  system written in Perl, PHP, C++, and JavaScript. It uses MySQL and Percona
  Server for MySQL, offers auto-discovery, SNMP, syslog, plugins, trending,
  trend prediction, triggers, a full-control web app, distributed monitoring,
  and inventory under GPLv2 or commercial license.
