markdown: >-
  ## Overview


  CertAvert monitors SSL/TLS certificates on any port, checking expiry, chain
  problems, revocation, and host mismatch.


  ## Features


  - Monitor SSL/TLS certificates on any port

  - Check certificate expiry

  - Check chain problems

  - Check revocation status

  - Check host mismatch

  - Expiry notifications via email, Slack, or Discord


  ## Pricing


  Free tier: Monitor 15 domains free with expiry notifications via email, Slack
  or Discord. No credit card required for signup.
