name: Ganglia
description: Ganglia is an open-source scalable distributed monitoring system
  for high-performance computing clusters and grids. It uses RRDtool for data
  storage, supports logical grouping, trending, plugins, and a web viewing
  frontend, and is released under the BSD license.
